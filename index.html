<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataVitals: Healthcare Data Intelligence | CS + MedTech</title>
    <meta name="description"
        content="Master Healthcare Data Science. The only Quad-Track curriculum combining Computer Science, Clinical Systems, Biomedical Science, and Applied Labs.">
    <meta name="keywords"
        content="Healthcare Analytics, Medical AI, Bioinformatics, Data Science, Python, SQL, EHR, HL7, DICOM">
    <meta name="author" content="DataVitals Team">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://datavitals.app/">
    <meta property="og:title" content="DataVitals: Healthcare Data Intelligence">
    <meta property="og:description" content="Master CS, Clinical Systems, and Bio-Science in one platform.">
    <meta property="og:image" content="logo.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://datavitals.app/">
    <meta property="twitter:title" content="DataVitals: Healthcare Intelligence">
    <meta property="twitter:description" content="Master CS, Clinical Systems, and Bio-Science in one platform.">
    <meta property="twitter:image" content="logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@300;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=6.0">
    <link rel="stylesheet" href="design_system.css">
    <link rel="stylesheet" href="CinematicScenes.css">
    <script src="QuantumField.js"></script>
    <script src="AuraVisual.js"></script>
    <!-- FontAwesome for Vitals Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- MUST BE LAST TO OVERRIDE ALL LEGACY GRIDS -->
    <link rel="stylesheet" href="HorizonLayout.css">
</head>

<body>

    <!-- NEURAL OVERLAYS -->
    <div id="cursor-aura" class="cursor-aura"></div>
    <div id="focus-spotlight" class="focus-spotlight"></div>
    <svg class="cursor-trail-container"
        style="position:fixed; inset:0; pointer-events:none; z-index:99998; width:100%; height:100%;">
        <path id="cursor-trail" class="cursor-trail" d=""></path>
    </svg>

    <div class="ai-observer-hud">
        <div class="ai-core-container">
            <div class="ai-core-ring"></div>
            <div id="ai-observer-core"></div>
        </div>
        <div class="ai-status">
            <span
                style="font-family: 'Space Grotesk'; font-weight: 700; font-size: 0.8rem; color: var(--accent-cyan);">AURA_OS
                v7.4</span>
        </div>
    </div>
    <div id="splash-screen" class="hidden"></div>

    <!-- QUANTUM FIELD HUD -->
    <main class="bento-grid">

        <!-- COLUMN 1: CURRICULUM SIDEBAR -->
        <nav class="bento-card card-sidebar">
            <div class="sidebar-header" style="padding: 24px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 16px;">
                <img src="logo.png" alt="Logo" class="sidebar-logo" style="width: 32px; filter: drop-shadow(0 0 10px var(--accent-cyan));">
                <span style="font-family: 'Space Grotesk'; font-weight: 700; color: white; font-size: 1.2rem; letter-spacing: -0.5px;">DataVitals</span>
            </div>
            <div id="sidebar-curriculum" style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px;">
                <!-- Curriculum injected by script.js -->
            </div>
            <div class="sidebar-footer" style="padding: 16px; border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-around;">
                <div class="nav-item-killer" onclick="showMyProgress()" title="Progress">📈</div>
                <div class="nav-item-killer" onclick="showResources()" title="Library">📚</div>
                <div class="nav-item-killer" onclick="toggleTerminal()" title="Terminal">💻</div>
                <div class="nav-item-killer" onclick="handleLogout()" title="Reset" style="color: var(--accent-pink);">⏻</div>
            </div>
        </nav>

        <!-- COLUMN 2: INFINITE WORKSPACE (Main Dashboard) -->
        <section class="bento-card card-hero">
            <header class="workspace-header"
                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 24px;">
                <h1 id="page-title" class="text-gradient"
                    style="font-family: 'Space Grotesk'; font-size: 2.2rem; letter-spacing: -1px; font-weight: 700;">
                    Dashboard</h1>

                <div style="display: flex; gap: 16px; align-items: center; margin-right: 180px;">
                    <div class="search-bar"
                        style="width: 300px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 12px 16px;">
                        <span class="search-icon" style="opacity: 0.5;">🔍</span>
                        <input type="text" placeholder="Search knowledge base..." onkeyup="filterModules(this.value)"
                            style="background: transparent; border: none; color: white; width: 80%; outline: none; margin-left: 8px; font-family: 'Plus Jakarta Sans'; font-size: 0.9rem;">
                    </div>
                    <button id="toggle-aura-btn" onclick="toggleAuraSidebar()" class="btn-neural"
                        style="padding: 12px 20px; font-size: 0.8rem; display: flex; align-items: center; gap: 8px; border-radius: 8px; background: rgba(6, 182, 212, 0.1); border: 1px solid rgba(6, 182, 212, 0.3); z-index: 10;">
                        <span id="aura-toggle-icon">◨</span> AI Overlay
                    </button>
                </div>
            </header>
            <div id="app" class="content-scrollable" style="flex: 1; padding: 0;">
                <div class="loading-screen">
                    <div class="loader-spinner"></div>
                    <p>Synchronizing System...</p>
                </div>
            </div>
        </section>

        <!-- COLUMN 3: AURA AI SIDEBAR (Hidden in Learning Mode) -->
        <aside class="bento-card card-aura" style="display: none !important;">
            <div class="chat-header"
                style="border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 16px; margin-bottom: 24px;">
                <div class="bot-identity" style="display: flex; align-items: center;">
                    <div id="aura-waveform-container"
                        style="width: 32px; height: 32px; margin-right: 16px; border-radius: 50%; background: rgba(6, 182, 212, 0.2); box-shadow: 0 0 15px rgba(6,182,212,0.4);">
                    </div>
                    <div>
                        <span
                            style="font-family: 'Space Grotesk'; font-weight: 700; font-size: 1.1rem; display: block;">Aura
                            AI</span>
                        <span
                            style="font-family: 'JetBrains Mono'; font-size: 0.65rem; color: var(--accent-cyan);">SYSTEM_ARCHITECT</span>
                    </div>
                </div>
            </div>
            <div class="chat-messages" id="chat-messages"
                style="flex: 1; margin-bottom: 24px; font-size: 0.9rem; line-height: 1.5; overflow-y: auto; padding-right: 8px;">
                <div class="message bot-message"
                    style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 16px; margin-bottom: 16px;">
                    Neural link established. Awaiting instructions, Architect. I am ready to assist with your learning
                    objectives.
                </div>
            </div>
            <div class="chat-input-area"
                style="background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 4px; display: flex;">
                <input type="text" id="user-input" placeholder="Query Aura..." onkeypress="handleChatInput(event)"
                    style="flex: 1; background: transparent; border: none; padding: 12px; color: white; outline: none; font-family: 'Plus Jakarta Sans'; font-size: 0.9rem;">
                <button class="send-btn" onclick="sendMessage()"
                    style="background: rgba(6, 182, 212, 0.1); color: var(--accent-cyan); border: none; border-radius: 8px; width: 40px; height: 40px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center;">→</button>
            </div>
        </aside>

    </main>

    <!-- FLOATING TERMINAL MODAL (RETAINS Z-INDEX) -->
    <div id="terminal-modal" class="terminal-modal hidden">
        <div class="terminal-header">
            <span class="term-title"
                style="font-family: var(--font-mono); color: var(--text-muted); font-size: 0.9rem;">
                <span style="color:var(--success)">●</span> Neural Python Kernel (v3.11)
            </span>
            <div class="term-controls" style="display:flex; gap:10px;">
                <button id="term-run-btn" onclick="PythonEngine.run()" class="btn btn-primary"
                    style="font-size:0.8rem; padding: 6px 12px;">▶ Run Code</button>
                <button onclick="toggleTerminal()" class="close-term"
                    style="background:none; border:none; color:var(--text-muted); font-size:1.5rem; cursor:pointer; line-height:1;">×</button>
            </div>
        </div>
        <div class="terminal-body">
            <div id="monaco-container" class="editor-pane"></div>
            <div id="term-output" class="console-pane">
                <div class="term-line info">Click 'Run' to execute. Pyodide loading...</div>
            </div>
        </div>
    </div>

    <!-- NEURAL COMMAND BAR -->
    <div class="neural-command-container">
        <div class="command-bar glass-refractive">
            <span class="command-prompt">></span>
            <input type="text" id="neural-command-input"
                placeholder="Execute system command... [Try 'Focus' or 'Filter path']"
                onkeypress="handleCommand(event)">
        </div>
    </div>

    <!-- Firebase Core & Auth -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
    <script src="NeuralStorageHub.js"></script>

    <!-- Core Engine -->
    <script src="roadmap.js"></script>
    <script src="library_data.js"></script>
    <script src="modules.js"></script>
    <script src="gamification.js?v=5.5"></script>
    <script src="python_engine.js"></script>
    <script src="NarrativeEngine.js"></script>
    <script src="LoginOverlay.js"></script>
    <script src="GuidedLoading.js"></script>
    <script src="SpotlightTour.js"></script>
    <script src="script.js?v=7.0"></script>
</body>

</html>
